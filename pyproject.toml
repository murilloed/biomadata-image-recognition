[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomadata-image-recognition"
version = "0.1.0"
description = "Independent synthetic environmental image comparison demo"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[tool.setuptools.packages.find]
include = ["biomavision*"]
